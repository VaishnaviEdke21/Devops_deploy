<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOpsDeploy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="card">
            <h1>DevOpsDeploy 🚀</h1>

            <p>
                Automated web application deployment using
                Git, Jenkins and Docker.
            </p>

            <div class="tools">
                <span>Git</span>
                <span>Jenkins</span>
                <span>Docker</span>
                <span>AWS</span>
            </div>

            <button onclick="showMessage()">
                Check Deployment
            </button>

            <p id="message"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
